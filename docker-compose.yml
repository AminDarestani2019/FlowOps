services:

  flowops-postgres:
    image: postgres:17-alpine
    container_name: flowops-postgres

    environment:
      POSTGRES_DB: flowops
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: ${FLOWOPS_POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - flowops-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U flowops -d flowops"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


volumes:

  flowops-postgres-data: